# MAKO CHAT — installer builds (PLAN D7).
#
# Test gate first, then native installers on native runners, published as
# a GitHub Release when a tag like v0.8.0 is pushed:
#   git tag v0.8.0 && git push origin v0.8.0
# Pull the .exe / .dmg from the release page and copy them to the USB
# stick for distribution (spec §3).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npx electron-builder --win nsis
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: client/release/*.exe
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      # Unsigned v1: stop electron-builder from looking for codesigning
      # identities it will not find on the runner.
      - run: npx electron-builder --mac dmg
        working-directory: client
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: client/release/*.dmg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-installer"
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            installers/*.exe
            installers/*.dmg
          generate_release_notes: true
